<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 610" fill="none">
  <title>SpikeNav conceptual navigation payload</title>
  <desc>Generic quadrotor carrying an event sensor, two single-point rangefinders, a spiking processor, RGB and thermal cameras and a GPU. Cones are schematic, not a specified lens or measured sensor coverage.</desc>
